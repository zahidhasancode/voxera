[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:app.telephony.audio_convert
markers =
    unit: Fast unit tests with mocked I/O (default)
    integration: Requires DATABASE_URL and external services
    e2e: End-to-end multi-subsystem scenarios
    voice: Voice pipeline and WebSocket tests
    security: Security and abuse-case tests
    chaos: Fault injection and resilience tests
    slow: Load and long-running benchmarks
    benchmark: Performance benchmark tests
addopts = --strict-markers -ra --import-mode=importlib
