groups:
  - name: voxera-api
    rules:
      - alert: VoxeraHighErrorRate
        expr: rate(voxera_http_errors_total[5m]) / clamp_min(rate(voxera_http_requests_total[5m]), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High HTTP error rate on VOXERA API
          description: Error rate exceeds 5% over 5 minutes.

      - alert: VoxeraHighLatencyP95
        expr: voxera_http_latency_p95_ms > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High API latency (p95)
          description: P95 latency exceeds 500ms for 10 minutes.

      - alert: VoxeraVoiceLatencyHigh
        expr: voxera_voice_first_audio_ms{quantile="0.95"} > 2000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Voice pipeline latency elevated
          description: Current voice latency exceeds 400ms.

      - alert: VoxeraVoiceQueueBacklog
        expr: voxera_voice_queue_depth > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Voice queue depth high
          description: Queue depth indicates potential overload.

      - alert: VoxeraTargetDown
        expr: up{job="voxera-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: VOXERA API scrape target down
          description: Prometheus cannot scrape the API metrics endpoint.
