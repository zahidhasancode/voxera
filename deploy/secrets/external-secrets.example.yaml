# External Secrets Operator example (future)
#
# Install: https://external-secrets.io/
# Sync secrets from AWS SM / Azure KV / GCP SM / Vault into Kubernetes.
#
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: voxera-api-secrets
#   namespace: voxera-prod
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: aws-secrets-manager
#     kind: ClusterSecretStore
#   target:
#     name: voxera-api-secrets
#     creationPolicy: Owner
#   data:
#     - secretKey: JWT_SECRET_KEY
#       remoteRef:
#         key: voxera/prod/jwt-secret
#     - secretKey: API_KEY_SECRET
#       remoteRef:
#         key: voxera/prod/api-key-secret
#     - secretKey: ENCRYPTION_SECRET_KEY
#       remoteRef:
#         key: voxera/prod/encryption-secret
#     - secretKey: DATABASE_URL
#       remoteRef:
#         key: voxera/prod/database-url

# Provider mapping (app config IAM_SECRET_PROVIDER):
#   local  → Kubernetes Secret / env file (current)
#   aws    → AWS Secrets Manager via External Secrets
#   azure  → Azure Key Vault via External Secrets
#   gcp    → Google Secret Manager via External Secrets
#   vault  → HashiCorp Vault via External Secrets
