{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voxera.fullname" . }}-worker
  labels:
    {{- include "voxera.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "voxera.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "voxera.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: {{ include "voxera.api.image" . }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "voxera.fullname" . }}-api-config
            - secretRef:
                name: {{ .Values.api.existingSecret }}
          env:
            - name: RUN_MIGRATIONS
              value: "false"
            - name: VOXERA_SERVICE_ROLE
              value: worker
            - name: WORKERS
              value: {{ .Values.worker.workers | quote }}
          {{- with .Values.api.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.livenessProbe.path }}
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: {{ .Values.api.readinessProbe.path }}
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
      {{- with .Values.api.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
