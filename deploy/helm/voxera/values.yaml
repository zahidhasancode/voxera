# Default values for voxera Helm chart.
# Override per environment: values-staging.yaml, values-production.yaml

global:
  environment: production
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

api:
  replicaCount: 2
  image:
    repository: ghcr.io/voxera/voxera-api
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  livenessProbe:
    path: /api/v1/health/live
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    path: /api/v1/health/ready
    initialDelaySeconds: 20
    periodSeconds: 10
  startupProbe:
    path: /api/v1/health/ready
    failureThreshold: 30
    periodSeconds: 10
  env:
    ENVIRONMENT: production
    WORKERS: "4"
    RUN_MIGRATIONS: "true"
    VALIDATE_CONFIG: "true"
    KNOWLEDGE_STORAGE_PATH: /data/knowledge
  existingSecret: voxera-api-secrets
  extraEnv: {}
  volumeMounts:
    - name: knowledge-data
      mountPath: /data/knowledge
  volumes:
    - name: knowledge-data
      persistentVolumeClaim:
        claimName: voxera-knowledge-pvc

dashboard:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/voxera/voxera-dashboard
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  buildArgs:
    viteApiUrl: /api/v1

web:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/voxera/voxera-web
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.voxera.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api
    - host: app.voxera.example.com
      paths:
        - path: /
          pathType: Prefix
          service: dashboard
  tls:
    - secretName: voxera-tls
      hosts:
        - api.voxera.example.com
        - app.voxera.example.com

postgresql:
  enabled: true
  auth:
    username: voxera
    database: voxera
    existingSecret: voxera-postgres-secret
  primary:
    persistence:
      enabled: true
      size: 50Gi
  image:
    registry: docker.io
    repository: pgvector/pgvector
    tag: pg16

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 8Gi

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    path: /api/v1/metrics

networkPolicy:
  enabled: true

secrets:
  provider: local  # local | aws | azure | gcp | vault
  # Keys expected in voxera-api-secrets K8s secret (never commit values):
  # JWT_SECRET_KEY, API_KEY_SECRET, ENCRYPTION_SECRET_KEY, DATABASE_URL

featureFlags:
  voiceRequireProviders: false
  knowledgeRequireProviders: true

canary:
  enabled: false
  weight: 10

worker:
  enabled: true
  replicaCount: 2
  workers: "2"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

blueGreen:
  enabled: false
