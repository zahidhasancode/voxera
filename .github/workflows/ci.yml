name: CI

# Every job here runs a command that also passes on a developer machine:
#   ruff check app/ tests/ scripts/
#   python -m pytest -m "not integration and not slow"
#   npm ci && npm run build   (web/ and dashboard/)
# Integration tests need a PostgreSQL database and are run by hand (see TESTING.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app/ tests/ scripts/

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      SECRET_KEY: test-secret-key-for-ci-minimum-32-chars
      JWT_SECRET_KEY: test-jwt-secret-key-for-ci-min-32-chars
      API_KEY_SECRET: test-api-key-secret-for-ci-min-32-chars
      ENCRYPTION_SECRET_KEY: test-encryption-secret-ci-min-32-chars
      VOICE_REQUIRE_PROVIDERS: "false"
      KNOWLEDGE_REQUIRE_PROVIDERS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -m "not integration and not slow" -q

  build-dashboard:
    name: Build and Test Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build
      - run: npm run test

  build-web:
    name: Build Voice Demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build
