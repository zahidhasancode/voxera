name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (git SHA or semver)
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.voxera.example.com
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate image tag
        run: |
          if [ -z "${{ github.event.inputs.image_tag }}" ]; then
            echo "image_tag is required"
            exit 1
          fi

      - name: Helm upgrade (production)
        run: |
          echo "Production deploy requires manual approval via GitHub environment protection."
          echo "Run: helm upgrade --install voxera deploy/helm/voxera \
            -f deploy/helm/voxera/values-production.yaml \
            --set api.image.tag=${{ github.event.inputs.image_tag }} \
            --namespace voxera-prod --create-namespace"
          # Add: azure/k8s-set-context or aws eks update-kubeconfig + helm upgrade

      - name: Post-deploy smoke test
        run: |
          echo "Verify: curl -f https://api.voxera.example.com/api/v1/health/ready"
