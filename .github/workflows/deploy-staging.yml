name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/voxera

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}

      - name: Build and push Dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.dashboard
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-dashboard:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-dashboard:${{ github.sha }}

      - name: Helm upgrade (staging)
        run: |
          echo "Deploy with: helm upgrade --install voxera deploy/helm/voxera \
            -f deploy/helm/voxera/values-staging.yaml \
            --set api.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api \
            --set api.image.tag=${{ github.sha }} \
            --namespace voxera-staging --create-namespace"
          # Wire to your cluster credentials (kubeconfig secret) in GitHub environment
