<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var stored = localStorage.getItem("voxera-theme");
        var theme = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.className = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOXERA — Real-time voice-agent prototype</title>
    <meta name="description" content="VOXERA is a personal project by MD Zahid Hasan: a real-time voice-agent prototype with streaming speech-to-text, LLM, and text-to-speech over WebSockets, turn-taking, and barge-in. Source on GitHub." />
    <meta property="og:title" content="VOXERA — Real-time voice-agent prototype" />
    <meta property="og:description" content="Streaming speech-to-text, LLM, and text-to-speech over WebSockets with turn-taking and barge-in. A personal project by MD Zahid Hasan; source on GitHub." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
